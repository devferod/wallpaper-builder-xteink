<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallpaper X4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="card header">
      <h1>Wallpaper X4</h1>
      <div id="msg" aria-live="polite"></div>
    </header>

    <main>
      <div class="grid">
        <div id="stage" class="card stage">
          <label id="empty" for="file" class="empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
            <span>Enviar imagem</span>
          </label>
          <img id="img" alt="Imagem enviada" draggable="false" hidden>
          <div id="crop" hidden></div>
        </div>

        <div class="side">
          <input id="file" class="file-input sr" type="file" accept="image/*">
          <label for="file" class="nb-btn light">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.2L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 15.5 6.2L21 16"/><path d="M21 21v-5h-5"/></svg>
            <span>Trocar</span>
          </label>
          <button id="save" class="nb-btn" type="button" disabled>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/></svg>
            <span>Salvar</span>
          </button>
        </div>

        <div class="card zoom-row">
          <label for="zoom">Zoom</label>
          <input id="zoom" class="nb-zoom" type="range" min="1" max="4" step="0.01" value="1" disabled>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
